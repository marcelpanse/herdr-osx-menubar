# herdr-osx-menubar — a macOS menu bar companion for herdr.
#
# herdr's plugin system runs processes; it cannot draw a menu bar item itself.
# So this plugin builds and manages a small AppKit app (HerdrBar.app) that owns
# the icon, and feeds it herdr state through an event hook.
#
# On notifications: herdr already delivers its own ([ui.toast], [ui.sound]).
# This plugin posts no notifications and changes no notification settings — the
# `pane.agent_status_changed` hook below only drives the icon's badge and its
# attention flash, so an agent waiting for input is noticeable from anywhere on
# screen.

id = "herdr-osx-menubar"
name = "herdr-osx-menubar"
version = "0.2.0"
# The panel reads `session.snapshot`'s `agents` array (including
# `terminal_title_stripped` and `focused_workspace_id`) and focuses rows with
# `agent.focus`. All of that is verified against 0.8.2; earlier 0.8.x releases
# are untested, so that is the floor claimed here.
min_herdr_version = "0.8.2"
description = "macOS menu bar icon for herdr: see every agent and its status at a glance, and click one to focus it."
platforms = ["macos"]

# Compiles the Swift app and installs it to ~/Applications/HerdrBar.app.
# NOTE: `herdr plugin link` does not run build steps — run scripts/build.sh by
# hand when developing locally.
[[build]]
command = ["bash", "scripts/build.sh"]

# Bring the icon up alongside a herdr server. This does not cover the case the
# icon exists for (herdr closed), so also run the `install-login-item` action.
[[startup]]
command = ["bash", "scripts/ensure-bar.sh"]

# The only event hook. `pane.agent_status_changed` cannot be subscribed to
# globally over the socket API — it requires a concrete pane_id — but herdr's
# plugin hook allowlist accepts it, so this is the way to watch every pane.
[[events]]
on = "pane.agent_status_changed"
command = ["bash", "scripts/forward-event.sh"]

[[actions]]
id = "open-panel"
title = "Show the agents panel"
description = "Open HerdrBar's agents panel — every agent, its project and its status."
command = ["bash", "scripts/action-open-panel.sh"]

[[actions]]
id = "open-picker"
title = "Open a folder in herdr"
description = "Show HerdrBar's folder picker and open the chosen folder as a workspace."
command = ["bash", "scripts/action-open-picker.sh"]

[[actions]]
id = "install-login-item"
title = "Start HerdrBar at login"
description = "Install the LaunchAgent so the menu bar icon is present even when herdr is not running."
command = ["bash", "scripts/install-login-item.sh"]

[[actions]]
id = "restart-bar"
title = "Restart HerdrBar"
description = "Stop and relaunch the menu bar app, picking up a fresh build."
command = ["bash", "scripts/restart-bar.sh"]
